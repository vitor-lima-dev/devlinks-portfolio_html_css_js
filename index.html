<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLink's Developed By Vitor Lima</title>

    <!-- FONTAWESOME ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- EXTERNAL FONT LINKS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- FAVICON -->
    <link rel="shortcut icon" href="./src/assets/images/avatar.png" type="image/x-icon" id="src-favicon">

    <!-- CSS STYLE LINKS -->
    <link rel="stylesheet" href="./src/styles/page_variables.css">
    <link rel="stylesheet" href="./src/styles/reset_styles.css">
    <link rel="stylesheet" href="./src/styles/main_styles.css">
</head>

<body>

    <div id="page__container">
        <!-- HEADER CONTENT -->
        <header>
            <!-- PROFILE SECTION -->
            <section id="header__profile" aria-label="Foto de perfil e nome do desenvolvedor Vitor de Lima">
                <img src="./src/assets/images/avatar.png" alt="Foto de perfil, Astronauta flutuando no espaço segurando uma água viva">
                <p>Vitor Lima Dev</p>
            </section>

            <!-- THEME SWITCH SECTION -->
            <section id="header__toggle" aria-label="Alternar entre tema claro e escuro">
                <label class="toggle-theme">
                    <input type="checkbox" id="toggle">
                    <span class="slider"></span>
                </label>
            </section>
        </header>

        <!-- MAIN CONTENT -->
        <main>
            <!-- NAVIGATION LINKS SECTION -->
            <nav id="main__nav-links" aria-label="Links principais">
                <ul role="list">
                    <li><a href="#" target="_blank" rel="external noopener noreferrer" aria-label="Acessar meus projetos principais">Projetos em Destaque</a></li>
                    <li><a href="#" target="_blank" rel="external noopener noreferrer" aria-label="Acessar aba de skills">Habilidades & Tecnologias</a></li>
                    <li><a href="#" target="_blank" rel="external noopener noreferrer" aria-label="Baixar meu currículo">Currículo</a></li>
                    <li><a href="#" target="_blank" rel="external noopener noreferrer" aria-label="Formas de entrar em contato">Entre em Contato</a></li>
                </ul>
            </nav>

            <!-- SOCIAL LINKS SECTION -->
            <section id="main__social-links" aria-label="Links de redes sociais">
                <a href="#" target="_blank" rel="external noopener noreferrer" class="social-links--hover" aria-label="Vitor's GitHub"><ion-icon name="logo-github"></ion-icon></a>
                <a href="#" target="_blank" rel="external noopener noreferrer" class="social-links--hover" aria-label="Vitor's Instragram"><ion-icon name="logo-instagram"></ion-icon></a>
                <a href="#" target="_blank" rel="external noopener noreferrer" class="social-links--hover" aria-label="Vitor's Youtube"><ion-icon name="logo-youtube"></ion-icon></a>
                <a href="#" target="_blank" rel="external noopener noreferrer" class="social-links--hover" aria-label="Vitor's Linkedin"><ion-icon name="logo-linkedin"></ion-icon></a>
            </section>

            <!-- FOOTER SECTION -->
            <footer id="main__footer" aria-label="Rodapé principal">
                <p>Designed by <a href="https://github.com/vitor-lima-dev" target="_blank" rel="external noopener noreferrer" aria-label="Perfil do Github">Vitor Lima Dev</a></p>
                <p>Copyright&copy; <span id="year">2026</span></p>
            </footer>
        </main>

        <!-- IONICONS -->
        <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
        
        <!-- JAVASCRIPT -->
        <script src="./src/javascript/script.js"></script>
</body>

</html>
